<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon UI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- ================= HEADER ================= -->

        <header>

            <button class="menu"></button>

            <img src="images/logo.png" alt="Pokemon Logo" class="logo">

            <button class="theme"></button>

        </header>

        <!-- ================= SEARCH ================= -->

        <section class="search">

            <input
                type="text"
                placeholder="Search for a Pokémon..."
            >

            <button class="filter-btn">
                Filter by types (1)
            </button>

            <button class="sort-btn"></button>

        </section>

        <!-- ================= POKEMON CARDS ================= -->

        <section class="cards">

            <!-- Card 1 -->

            <article class="card type-grass">

                <p class="number">
                    #0908
                </p>

                <button class="fav"></button>

                <img
                    src="images/pikachu.png"
                    alt="Meowscarada"
                    class="pokemon-image"
                >

                <h2>
                    Meowscarada
                </h2>

                <button class="type type-grass">
                    GRASS
                </button>

                <button class="arrow"></button>

            </article>

            <!-- Card 2 -->

            <article class="card type-steel">

                <p class="number">
                    #0624
                </p>

                <button class="fav"></button>

                <img
                    src="images/pikachu.png"
                    alt="Pawniard"
                    class="pokemon-image"
                >

                <h2>
                    Pawniard
                </h2>

                <button class="type type-steel">
                    DARK / STEEL
                </button>

                <button class="arrow"></button>

            </article>

            <!-- Card 3 -->

            <article class="card type-fire">

                <p class="number">
                    #0229
                </p>

                <button class="fav"></button>

                <img
                    src="images/pikachu.png"
                    alt="Houndoom"
                    class="pokemon-image"
                >

                <h2>
                    Houndoom
                </h2>

                <button class="type type-fire">
                    DARK / FIRE
                </button>

                <button class="arrow"></button>

            </article>

            <!-- Card 4 -->

            <article class="card type-psychic">

                <p class="number">
                    #0686
                </p>

                <button class="fav"></button>

                <img
                    src="images/pikachu.png"
                    alt="Inkay"
                    class="pokemon-image"
                >

                <h2>
                    Inkay
                </h2>

                <button class="type type-psychic">
                    DARK / PSYCHIC
                </button>

                <button class="arrow"></button>

            </article>

        </section>

        <!-- ================= FEATURES ================= -->

        <section class="features">

            <article class="feature feature-explore">

                <h3>
                    Explore
                </h3>

                <p>
                    Discover all your favourite Pokémon
                </p>

            </article>

            <article class="feature feature-filter">

                <h3>
                    Filter
                </h3>

                <p>
                    Find Pokémon by types and abilities
                </p>

            </article>

            <article class="feature feature-collection">

                <h3>
                    Collection
                </h3>

                <p>
                    Save and manage your collection
                </p>

            </article>

            <article class="feature feature-stats">

                <h3>
                    Stats
                </h3>

                <p>
                    View stats and learn about Pokémon
                </p>

            </article>

        </section>

        <!-- ================= FOOTER ================= -->

        <footer>

            <p>
                © 2024 Pokémon. All rights reserved.
            </p>

        </footer>

    </main>

</body>

</html>
